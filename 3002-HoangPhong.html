function teamRank(v){var order=['FG PC','FG HCF','FG MIX','DT H&B','PC','HCF','MIX','WHOLESALER','MD'],k=String(v||'').toUpperCase().trim(),i=order.indexOf(k);return i<0?999:i}
function buildCombinedCoverageTable(){
 if(coverageBusy)return;coverageBusy=true;
 var cov=document.getElementById('cov'),smHost=document.getElementById('covSmDetail');if(!cov||!smHost||typeof DATA==='undefined'||!DATA||!Array.isArray(DATA.pjp)){coverageBusy=false;return}
 var oldTitle=cov.querySelector('.siteCoverageCombinedTitle'),oldTable=cov.querySelector('.siteCoverageCombined');if(oldTitle)oldTitle.remove();if(oldTable)oldTable.remove();
 var rows=DATA.pjp.slice(),title=make('div','siteCoverageCombinedTitle','Tỷ lệ đã bao phủ trên tổng số cửa hàng thuộc PJP'),table=make('div','siteCoverageCombined'),head=make('div','siteCoverageHead');
 ['Site/Đội','Total OL PJP','Hair 350G','Dove HF BT','Comfort Dây','Surf 2.9KG'].forEach(function(v){head.appendChild(make('span','',v))});table.appendChild(head);
 var siteRow=fillMetricRow(make('div','siteCoverageRow siteCoverageNpp'),'Total Site',metrics(rows));table.appendChild(siteRow);
 var teams=new Map();rows.forEach(function(x){var k=String(x.group||'Chưa phân đội').trim()||'Chưa phân đội';if(!teams.has(k))teams.set(k,[]);teams.get(k).push(x)});
 Array.from(teams.entries()).sort(function(a,b){return teamRank(a[0])-teamRank(b[0])||a[0].localeCompare(b[0],'vi')}).forEach(function(entry){
  var team=entry[0],teamRows=entry[1],details=make('details','siteCoverageTeam'),summary=make('summary','siteCoverageRow'),label=make('span','siteCoverageTeamName');label.appendChild(make('span','siteCoverageChevron','›'));label.appendChild(make('span','',team));summary.appendChild(label);var tm=metrics(teamRows);summary.appendChild(metricCell(tm.total,true));tm.rates.forEach(function(v){summary.appendChild(metricCell(v,false))});details.appendChild(summary);
  var body=make('div','siteCoverageSmRows'),members=new Map();teamRows.forEach(function(x){var key=String(x.smCode||siteSmName(x.sm)||'SM').trim();if(!members.has(key))members.set(key,{name:siteSmName(x.sm)||key,rows:[]});members.get(key).rows.push(x)});
  Array.from(members.values()).sort(function(a,b){return a.name.localeCompare(b.name,'vi')}).forEach(function(m){body.appendChild(fillMetricRow(make('div','siteCoverageRow'),m.name,metrics(m.rows)))});details.appendChild(body);table.appendChild(details);
 });
 smHost.parentNode.insertBefore(title,smHost);smHost.parentNode.insertBefore(table,smHost);coverageBusy=false;
}
function applySiteCoverage(){var chart=document.getElementById('covChart');if(chart)chart.style.display='none';var smHost=document.getElementById('covSmDetail');if(smHost){var smTitle=smHost.previousElementSibling;if(smTitle&&smTitle.classList.contains('covProTitle'))smTitle.style.display='none'}var leadership=document.getElementById('covLeadership');if(leadership){var t=leadership.previousElementSibling;if(t&&t.classList.contains('covProTitle'))t.style.display='none';leadership.style.display='none'}buildCombinedCoverageTable()}
function rebuildOverview(){
 var chart=document.getElementById('overviewCharts');if(chart){var duplicateTitle=chart.previousElementSibling;if(duplicateTitle&&duplicateTitle.classList.contains('section'))duplicateTitle.style.display='none'}
 if(overviewBusy)return;var host=document.getElementById('overview');if(!host)return;var blocks=host.querySelectorAll('details.siteAccordion');if(!blocks.length)return;overviewBusy=true;
 var card=make('div','siteSummaryCard'),grid=make('div','siteSummaryGrid'),head=make('div','siteSummaryHead');['Hạng mục','Target','Actual','GAP','% Actual'].forEach(function(v){head.appendChild(make('span','',v))});grid.appendChild(head);
 for(var i=0;i<blocks.length;i+=1){var block=blocks[i],source=q(block,'.xlRows .xlRow')||q(block,'.xlTotal');if(!source||source.children.length<5)continue;var c=source.children,row=make('div','siteSummaryRow');row.appendChild(make('span','siteSummaryCat',txt(q(block,'summary span:first-child'))));row.appendChild(make('b','',txt(c[1])));row.appendChild(make('b','',txt(c[2])));row.appendChild(make('b','',txt(c[3])));row.appendChild(make('b','siteSummaryPct '+(source.classList.contains('good')?'good':'risk'),txt(c[4])));grid.appendChild(row)}
 card.appendChild(grid);while(host.firstChild)host.removeChild(host.firstChild);host.appendChild(card);host.classList.add('siteSummaryHost');var title=document.querySelector('#ov .siteSection');if(title)title.textContent='% Thực đạt so với Target';overviewBusy=false;
}
var overview=document.getElementById('overview');if(overview&&window.MutationObserver)new MutationObserver(function(){window.setTimeout(rebuildOverview,0)}).observe(overview,{childList:true,subtree:false});
var cov=document.getElementById('cov'),covSource=document.getElementById('covSmDetail');if(covSource&&window.MutationObserver)new MutationObserver(function(){window.setTimeout(applySiteCoverage,0)}).observe(covSource,{childList:true,subtree:true});
rebuildOverview();applySiteCoverage();document.addEventListener('change',function(){window.setTimeout(function(){rebuildOverview();applySiteCoverage()},0)});
}());
</script>
</body></html>
