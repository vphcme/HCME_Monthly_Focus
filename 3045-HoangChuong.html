function decodePage(encoded) {
  const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
const frames = {
  monthly: document.getElementById("frame-monthly"),
  pjp: document.getElementById("frame-pjp"),
  action: document.getElementById("frame-action")
};
frames.monthly.srcdoc = decodePage(pageSources.monthly);
frames.pjp.srcdoc = decodePage(pageSources.pjp);
frames.action.srcdoc = decodePage(pageSources.action);

document.querySelectorAll(".nav button").forEach(button => {
  button.addEventListener("click", () => {
    const key = button.dataset.page;
    document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b === button));
    document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === key));
    setTimeout(() => {
      try { frames[key].contentWindow.postMessage({type:"hcme-request-height"}, "*"); } catch(e) {}
    }, 100);
    window.scrollTo({top:0, behavior:"smooth"});
  });
});
window.addEventListener("message", event => {
  if (!event.data || event.data.type !== "hcme-dashboard-height") return;
  for (const frame of Object.values(frames)) {
    if (frame.contentWindow === event.source && Number.isFinite(event.data.height)) {
      frame.style.height = Math.max(400, event.data.height + 4) + "px";
      break;
    }
  }
});

window.goatcounter.path = function () { return window.location.pathname; };
