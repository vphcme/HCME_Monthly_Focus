 function imgAsmRow(x){return `<div class="imgAsmRow"><span class="imgAsmName">${E(x.n)}</span><div class="imgAsmTrack">${imgTrack(x)}</div><b class="imgAsmPct ${x.v>=x.norm?'pctGood':'pctRisk'}">${P(x.v)}</b></div>`}
 function asmRows(c){let z=chartBase.filter(x=>x.cat===c),norm=z[0]?.norm??DATA.norms[CATS.indexOf(c)];return [...new Set(z.map(x=>x.asm))].sort((a,b)=>a.localeCompare(b,'vi')).map(asm=>aggregate(z.filter(x=>x.asm===asm),asm,norm))}
 let catBars=CATS.map(c=>{let z=chartBase.filter(x=>x.cat===c),norm=z[0]?.norm??DATA.norms[CATS.indexOf(c)];return aggregate(z,CHART_LABELS[c]||c,norm)});
 $('overviewCharts').innerHTML=cs.map(c=>{let i=CATS.indexOf(c),cb=catBars[i];return `<details class="imgChart"><summary>${imgCatRow({...cb,n:c})}<span class="imgToggle">⌄</span></summary><div class="imgAsmBody">${asmRows(c).map(imgAsmRow).join('')}</div></details>`}).join('');
 $('risks').innerHTML=cs.map(c=>{let all=b.filter(x=>x.cat===c&&x.ach<x.norm).sort((a,b)=>a.ach-b.ach),id='r'+c.replace(/\W/g,'');return `<details id="${id}" class="siteRiskGroup"><summary><span class="${c.startsWith('HAIR')?'hair':c.startsWith('DOVE')?'dove':c.startsWith('COMFORT')?'comfort':'surf'}">${E(c)}</span><b>${all.length} Site</b></summary>${all.length?all.map(x=>`<article class="riskSimple"><span>${E(x.site)}</span><b>${P(x.ach)}</b></article>`).join(''):'<div class="riskEmpty">Không có Site dưới Norm</div>'}</details>`}).join('');
 $('overview').innerHTML=cs.map(c=>{
  let z=b.filter(x=>x.cat===c),t=z.reduce((q,x)=>q+x.target,0),a=z.reduce((q,x)=>q+x.actual,0),r=t?a/t:0,n=z[0]?.norm??DATA.norms[CATS.indexOf(c)];
  let rows=z.slice().sort((x,y)=>x.asm.localeCompare(y.asm,'vi')||x.site.localeCompare(y.site,'vi'));
  let asmGroups=[...new Set(rows.map(x=>x.asm))].map(asm=>{let ar=rows.filter(x=>x.asm===asm),at=ar.reduce((q,x)=>q+x.target,0),aa=ar.reduce((q,x)=>q+x.actual,0),av=at?aa/at:0;return `<section class="xlAsmGroup"><div class="xlAsmTotal ${av>=n?'good':''}"><span>${E(asm)}</span><b>${N(at)}</b><b>${N(aa)}</b><b>${N(at-aa)}</b><b class="ach">${P(av)}</b></div>${ar.map(x=>`<div class="xlRow ${x.ach>=x.norm?'good':''}"><span class="xlSite">${E(x.site)}</span><b>${N(x.target)}</b><b>${N(x.actual)}</b><b>${N(x.target-x.actual)}</b><b class="ach">${P(x.ach)}</b></div>`).join('')}</section>`}).join('');
  return `<details class="xlBlock siteAccordion ${r>=n?'good':''}"><summary class="xlTitle"><span>${L(c)}</span><span class="siteTotal">${N(a)}/${N(t)} · ${P(r)}</span><small>Norm ${P(n)}</small></summary><div class="siteDetailBody"><div class="xlHead"><span>Site name</span><span>Target</span><span>Actual</span><span>GAP</span><span>% Actual</span></div>${$('oa').value?'':`<div class="xlTotal"><span>Total</span><b>${N(t)}</b><b>${N(a)}</b><b>${N(t-a)}</b><b class="ach">${P(r)}</b></div>`}<div class="xlRows">${asmGroups}</div></div></details>`
 }).join('')
}
