function buttons(id,type){$(id).innerHTML=cats.map((n,i)=>`<button type="button" class="cat" data-type="${type}" data-index="${i}" aria-pressed="${activeCategories.some(x=>x.type===type&&x.index===i)}">${n}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{let x={type:b.dataset.type,index:+b.dataset.index},i=activeCategories.findIndex(y=>y.type===x.type&&y.index===x.index);i>=0?activeCategories.splice(i,1):activeCategories.push(x);page=1;render()})}
function mergedRows(){const d=$('date').value,t=$('team').value,s=$('sm').value,q=$('outlet').value.trim().toLowerCase();const source=rows.filter(r=>(!d||r[0]===d)&&(!t||r[7]===t)&&(!s||r[3]===s)&&(!q||`${r[4]} ${r[5]}`.toLowerCase().includes(q)));const map=new Map(),dates=new Map();source.forEach(r=>{let key=`${r[1]}|${r[4]}`,x=map.get(key);if(!x){x=r.slice();map.set(key,x);dates.set(key,Array(4).fill(''))}let ds=dates.get(key);for(let i=0;i<4;i++){let v=canon(r[10+i]);if(v&&( !canon(x[10+i])||String(r[0])>=ds[i])){x[10+i]=v;ds[i]=String(r[0]);if(i===3)x[14]=String(r[14]||'')}}if(String(r[0])>String(x[0]))for(let i=0;i<10;i++)x[i]=r[i]});return [...map.values()]}
function filtered(){return mergedRows().filter(r=>activeCategories.every(x=>canon(r[10+x.index])===(x.type==='uncovered'?'Chưa bao phủ':'Chưa đủ điều kiện')))}function pill(r,i){let v=canon(r[10+i]);const note=i===3&&v==='Chưa đủ điều kiện'?String(r[14]||'').trim():'';return `<span class="pill ${cls(v)}"><span class="product">${cats[i]}</span><b>${esc(v||'')}</b>${note?`<small class="food-note">${esc(note)}</small>`:''}</span>`}
function render(){buttons('uncovered','uncovered');buttons('ineligible','ineligible');let all=filtered(),pages=Math.max(1,Math.ceil(all.length/pageSize));page=Math.min(page,pages);let part=all.slice((page-1)*pageSize,page*pageSize);$('count').textContent=fmt(all.length);$('tbody').innerHTML=part.map((r,i)=>`<tr><td>${(page-1)*pageSize+i+1}</td><td class="name">${esc(r[4])} · ${esc(r[5])}</td><td class="channel">${esc(r[6])}</td>${[0,1,2,3].map(j=>`<td>${pill(r,j)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="7" class="empty">Không có cửa hàng phù hợp.</td></tr>';$('cards').innerHTML=part.map((r,i)=>`<article class="card"><div class="cardhead"><span class="num">${(page-1)*pageSize+i+1}</span><div><div class="cardname">${esc(r[4])} · ${esc(r[5])}</div><div class="cardchannel">Channel: ${esc(r[6])}</div></div></div><div class="statuses">${[0,1,2,3].map(j=>pill(r,j)).join('')}</div></article>`).join('')||'<div class="empty">Không có cửa hàng phù hợp.</div>';let h=`<button data-p="${Math.max(1,page-1)}">‹</button>`;for(let p=1;p<=pages;p++){if(p<=3||p===pages||Math.abs(p-page)<=1)h+=`<button class="${p===page?'active':''}" data-p="${p}">${p}</button>`;else if(p===4)h+='<span>…</span>'}h+=`<button data-p="${Math.min(pages,page+1)}">›</button><label class="perpage"><span>Hiển thị </span><select id="pageSize"><option>5</option><option>10</option><option>20</option><option>50</option></select><span> / trang</span></label>`;$('pager').innerHTML=h;$('pageSize').value=pageSize;$('pageSize').onchange=e=>{pageSize=+e.target.value;page=1;render()};$('pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.p;render()});reportHeight()}
function init(){let bytes=Uint8Array.from(atob(DATA.p),c=>c.charCodeAt(0)),pos=0;rows=Array.from({length:DATA.c},()=>{let r=[];for(let i=0;i<DATA.n;i++){let value=0,shift=0,b;do{b=bytes[pos++];value|=(b&127)<<shift;shift+=7}while(b&128);r.push(DATA.d[i][value])}return r});let distinct=i=>[...new Set(rows.map(r=>r[i]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));fill('date',distinct(0));fill('team',distinct(7));fill('sm',distinct(3));['date','team','sm'].forEach(id=>$(id).onchange=()=>{page=1;render()});$('outlet').oninput=()=>{page=1;render()};render()}function reportHeight(){setTimeout(()=>parent.postMessage({type:'hcme-dashboard-height',height:Math.max(document.documentElement.scrollHeight,document.body.scrollHeight)},'*'),20)}window.addEventListener('resize',reportHeight);window.addEventListener('message',e=>{if(e.data&&e.data.type==='hcme-request-height')reportHeight()});try{init()}catch(e){document.body.innerHTML='<div class="empty">Không thể hiển thị PJP Action.</div>';console.error(e)}
</script></div></template>
<script>
(function(){
 const hosts={};
 const pageKeys=['monthly','pjp','action'];
 function init(key){
  if(hosts[key])return;
  const host=document.getElementById('host-'+key),template=document.getElementById('hcme-template-'+key);
  const root=host.attachShadow({mode:'open'});
  root.appendChild(template.content.cloneNode(true));
  const surface=root.querySelector('.hcme-root');
  const localDocument={
   getElementById:id=>root.getElementById(id),
   querySelector:selector=>root.querySelector(selector),
   querySelectorAll:selector=>root.querySelectorAll(selector),
   createElement:tag=>document.createElement(tag),
   createTextNode:text=>document.createTextNode(text),
   body:surface,documentElement:surface,
   addEventListener:(...args)=>root.addEventListener(...args)
  };
  hosts[key]=root;
  root.querySelectorAll('script[data-hcme-exec]').forEach(node=>{
   try{new Function('document','window','parent',node.textContent)(localDocument,window,window)}
   catch(error){console.error('HCME page '+key,error);host.dataset.error=String(error)}
   node.remove();
  });
 }
 document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{
  const key=button.dataset.page;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===button));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===key));
  init(key);window.scrollTo({top:0,behavior:'smooth'});
 }));
 init('monthly');
})();
</script>
