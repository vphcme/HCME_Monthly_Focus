 function members(reset=true){if(reset)m.value='';let rows=byDay().filter(x=>teamMatch(x.group,g.value)),keep=m.value,seen=new Set(),items=[];rows.forEach(x=>{if(x.smCode&&!seen.has(x.smCode)){seen.add(x.smCode);items.push([x.smCode,smName(x.sm)])}});items.sort((x,y)=>x[1].localeCompare(y[1],'vi'));m.innerHTML='<option value="">Tất cả SM</option>'+items.map(x=>'<option value="'+E(x[0])+'">'+E(x[1])+'</option>').join('');if(items.some(x=>x[0]===keep))m.value=keep;render(true)}

 function sizeBands(raw){let source=String(raw||''),bands=[],occupied=[];
  let rangeRe=/(\d+(?:[.,]\d+)?)\s*([KM])\s*-\s*(\d+(?:[.,]\d+)?)\s*([KM])/gi,m;
  while((m=rangeRe.exec(source))){let a=amount(m[1],m[2]),b=amount(m[3],m[4]);if(a!==null&&b!==null)bands.push([Math.min(a,b),Math.max(a,b)]);occupied.push([m.index,rangeRe.lastIndex])}

 function render(reset=true){let t=q.value.trim().toLowerCase(),u=sl.value.trim().toLowerCase(),sv=ss.value.trim();z=d.filter(x=>(!day.value||x.date===day.value)&&teamMatch(x.group,g.value)&&(!m.value||x.smCode===m.value)&&(!statusFilter||x.status[statusFilter.i]===statusFilter.value)&&(!t||x.outlet.toLowerCase().includes(t)||x.name.toLowerCase().includes(t))&&(!u||String(x.display||'').toLowerCase().includes(u))&&storeSizeMatch(x.size,sv));if(reset)limit=500;const uniqueOL=new Set(z.map(x=>String(x.outlet||'').trim()).filter(Boolean)).size;el.querySelector('.count').textContent=uniqueOL.toLocaleString('vi-VN')+' OL'+(day.value?' · '+day.value.slice(0,5):'');el.querySelector('.list').innerHTML=z.slice(0,limit).map(x=>`<article class="pCard ${x.status.every(v=>v==='Đã bao phủ')?'good':''}"><div class="pTitle">${E(x.outlet)} · ${E(x.name)}</div><div class="pMeta">${E(x.site)}</div><div class="pMeta">${E(x.group)} | ${E(smName(x.sm))}</div><div class="pMeta">Ngày PJP: ${E(x.date)} | Channel: ${E(x.channel||'—')}</div><div class="pGrid"><div class="pInfo"><div class="label">Store list T10</div><div class="value">${E(x.display||'—')}</div></div><div class="pInfo"><div class="label">Store size Hair | Fabenc | Fabclean</div><div class="value">${E(x.size||'—')}</div></div>${x.status.map((v,i)=>`<div class="pStatus ${cls(v)}"><div class="label">${CATS[i]}</div><div class="value">${E(v||'—')}</div></div>`).join('')}</div></article>`).join('');let more=el.querySelector('.pMore');more.style.display=limit<z.length?'block':'none';more.onclick=()=>{limit+=500;render(false)}}
 function choose(value,e){let b=e.target.closest('button');if(!b)return;let next={i:+b.dataset.i,value};statusFilter=statusFilter&&statusFilter.i===next.i&&statusFilter.value===next.value?null:next;red.querySelectorAll('button').forEach(x=>x.classList.toggle('on',statusFilter&&statusFilter.value==='Chưa bao phủ'&&+x.dataset.i===statusFilter.i));yellow.querySelectorAll('button').forEach(x=>x.classList.toggle('on',statusFilter&&statusFilter.value==='Chưa đủ điều kiện'&&+x.dataset.i===statusFilter.i));render(true)}
 red.onclick=e=>choose('Chưa bao phủ',e);yellow.onclick=e=>choose('Chưa đủ điều kiện',e);day.onchange=()=>teams(true);g.oninput=()=>members(true);m.onchange=()=>render(true);q.oninput=()=>render(true);sl.oninput=()=>render(true);ss.oninput=()=>render(true);teams(false)
}

(function(){'use strict';var overviewBusy=false,coverageBusy=false;

function pctClass(v){return v<50?'covRed':v<80?'covYellow':'covGreen'}

function uniqueRows(rows){var map=new Map();rows.forEach(function(x){var k=String(x.outlet||'').trim();if(k&&!map.has(k))map.set(k,x)});return Array.from(map.values())}

 if(coverageBusy)return;coverageBusy=true;

 var rows=DATA.pjp.slice(),title=make('div','siteCoverageCombinedTitle','Tỷ lệ đã bao phủ trên tổng số cửa hàng thuộc PJP'),table=make('div','siteCoverageCombined'),head=make('div','siteCoverageHead');
 ['Site/Đội','Total OL PJP','Hair 350G','Dove HF BT','Comfort Dây','Surf 2.9KG'].forEach(function(v){head.appendChild(make('span','',v))});table.appendChild(head);

 Array.from(teams.entries()).sort(function(a,b){return teamRank(a[0])-teamRank(b[0])||a[0].localeCompare(b[0],'vi')}).forEach(function(entry){
  var team=entry[0],teamRows=entry[1],details=make('details','siteCoverageTeam'),summary=make('summary','siteCoverageRow'),label=make('span','siteCoverageTeamName');label.appendChild(make('span','siteCoverageChevron','›'));label.appendChild(make('span','',team));summary.appendChild(label);var tm=metrics(teamRows);summary.appendChild(metricCell(tm.total,true));tm.rates.forEach(function(v){summary.appendChild(metricCell(v,false))});details.appendChild(summary);

 });

 card.appendChild(grid);while(host.firstChild)host.removeChild(host.firstChild);host.appendChild(card);host.classList.add('siteSummaryHost');var title=document.querySelector('#ov .siteSection');if(title)title.textContent='% Thực đạt so với Target';overviewBusy=false;

var cov=document.getElementById('cov'),covSource=document.getElementById('covSmDetail');if(covSource&&window.MutationObserver)new MutationObserver(function(){window.setTimeout(applySiteCoverage,0)}).observe(covSource,{childList:true,subtree:true});
